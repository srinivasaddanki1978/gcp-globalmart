# GlobalMart CI/CD (Cloud Build trigger on push to main; runs as sa-cloudbuild).
#   1. tests in parallel: loader (pytest), app (vitest, typecheck, query contract check),
#      dbt CI (changed models + downstream into *_ci datasets, with tests/contracts)
#   2. only if all pass: build + push the loader, dbt and app images (tag = commit SHA)
#   3. deploy: app revision, and point both Cloud Run jobs at the new images
# Production data is refreshed by the workflow (gcloud workflows run globalmart-e2e),
# not by CI. Manual run: gcloud builds submit --config=cloudbuild.yaml --region=us-central1
substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

steps:
  - id: tag
    name: bash
    script: |
      # Commit SHA for trigger builds, build ID for manual `gcloud builds submit`.
      echo "${SHORT_SHA:-b${BUILD_ID:0:8}}" > /workspace/tag && cat /workspace/tag
    automapSubstitutions: true

  - id: loader-tests
    name: python:3.12-slim
    waitFor: ['-']
    script: |
      pip install -q -r loader/requirements.txt pytest
      cd loader && python -m pytest -q

  - id: app-tests
    name: node:24-slim
    waitFor: ['-']
    env: ['GCP_PROJECT=${PROJECT_ID}']
    script: |
      cd app
      npm ci --no-audit --no-fund
      npm test
      npm run typecheck
      npm run check:queries   # a Gold change that breaks an app query fails here

  - id: dbt-ci
    name: python:3.12-slim
    waitFor: ['-']
    env: ['GCP_PROJECT=${PROJECT_ID}', 'DBT_PROFILES_DIR=/workspace/dbt', 'RAW_BUCKET=${PROJECT_ID}-globalmart-raw']
    script: |
      set -e
      pip install -q -r dbt/requirements.txt
      mkdir -p prod-state
      python -c "from google.cloud import storage; import os; storage.Client().bucket(os.environ['RAW_BUCKET']).blob('dbt_state/prod/manifest.json').download_to_filename('prod-state/manifest.json')"
      cd dbt
      dbt deps
      dbt build --target ci --select state:modified+ --defer --state ../prod-state --fail-fast
      dbt docs generate --target prod --static
      mkdir -p ../app/dbt-docs && cp target/static_index.html ../app/dbt-docs/index.html

  - id: build-images
    name: gcr.io/cloud-builders/docker
    waitFor: [tag, loader-tests, app-tests, dbt-ci]
    script: |
      set -e
      TAG=$(cat /workspace/tag)
      REPO=${_REGION}-docker.pkg.dev/${PROJECT_ID}/globalmart
      for img in loader dbt app; do
        docker build -t $REPO/$img:$TAG -t $REPO/$img:latest $img
        docker push --all-tags $REPO/$img
      done
    automapSubstitutions: true

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [build-images]
    script: |
      set -e
      TAG=$(cat /workspace/tag)
      REPO=${_REGION}-docker.pkg.dev/${PROJECT_ID}/globalmart
      gcloud run deploy globalmart-app --image=$REPO/app:$TAG --region=${_REGION} --quiet
      gcloud run jobs update globalmart-loader --image=$REPO/loader:$TAG --region=${_REGION} --quiet
      gcloud run jobs update globalmart-dbt --image=$REPO/dbt:$TAG --region=${_REGION} --quiet
    automapSubstitutions: true
