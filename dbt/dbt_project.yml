name: globalmart
version: "1.0.0"
config-version: 2
profile: globalmart

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

# Datasets map 1:1 to the Databricks schemas. macros/generate_schema_name.sql
# makes `+schema` the literal dataset name (no `<target>_` prefix).
vars:
  # GenAI (models/genai). Confirm model names at the start of each phase (Risk 6).
  genai_connection: "us-central1.vertex-ai"       # BigQuery -> Vertex AI connection (Terraform)
  genai_endpoint: "gemini-3.5-flash"
  genai_embedding_endpoint: "text-embedding-005"  # 768 dimensions

models:
  globalmart:
    +persist_docs:
      relation: true
      columns: true
    silver:
      +schema: silver
      +materialized: table
      staging: # harmonise column variants + explicit casts; views over bronze
        +materialized: view
    gold:
      +schema: gold
      +materialized: table
    metrics:
      +schema: metrics
      +materialized: table
    genai:
      +schema: gold
      +materialized: table
      +tags: [genai]
    reporting: # one view per Looker Studio chart dataset
      +schema: gold
      +materialized: view

seeds:
  globalmart:
    +schema: gold

snapshots:
  globalmart:
    +schema: silver # history store behind gold.dim_customers; never drop it
