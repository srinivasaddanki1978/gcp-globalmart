version: 2

models:
  - name: mv_slow_moving_products
    description: "Product x region performance; is_slow_moving = bottom 25% by quantity within the region (Inventory Blindspot)."
    config:
      contract: { enforced: true }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [product_id, region] }
    columns:
      - name: product_id
        data_type: string
      - name: product_name
        data_type: string
      - name: brand
        data_type: string
      - name: region
        data_type: string
      - name: total_sales
        data_type: float64
      - name: total_quantity
        data_type: int64
      - name: order_count
        data_type: int64
      - name: total_profit
        data_type: float64
      - name: is_slow_moving
        data_type: bool
