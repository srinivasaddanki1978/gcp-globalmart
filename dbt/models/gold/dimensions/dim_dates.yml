version: 2

models:
  - name: dim_dates
    description: "Calendar dimension, one row per day for full calendar years spanning all order and return dates, plus the Unknown member (-1). Plays two roles: order date (fact_sales.order_date_sk) and return date (fact_returns.return_date_sk)."
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [date_sk]
    columns:
      - name: date_sk
        description: "Surrogate key as yyyymmdd (e.g. 20240131); -1 = Unknown."
        data_type: int64
        constraints: [{ type: not_null }]
        data_tests: [unique]
      - name: date_key
        description: "The calendar date."
        data_type: date
      - name: year
        data_type: int64
      - name: quarter
        data_type: int64
      - name: month
        data_type: int64
      - name: month_name
        data_type: string
      - name: day
        data_type: int64
      - name: day_of_week
        description: "1 = Sunday ... 7 = Saturday."
        data_type: int64
      - name: is_weekend
        data_type: bool
