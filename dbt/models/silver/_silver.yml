version: 2

models:
  - name: clean_customers
    description: "Validated, harmonised customers. Duplicates are kept for Gold's survivorship dedup."
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: customer_name
        data_tests: [not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments: { values: ["Consumer", "Corporate", "Home Office"] }
      - name: region
        data_tests:
          - accepted_values:
              arguments: { values: ["East", "West", "South", "Central", "North"] }
      - name: city
        description: "Swapped with state for Region 4 files (fixed by folder name)."

  - name: clean_orders
    description: "Validated orders with ship mode expanded and the purchase date parsed."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: ship_mode
        data_tests:
          - accepted_values:
              arguments: { values: ["First Class", "Second Class", "Standard Class", "Same Day"] }
      - name: order_status
        data_tests:
          - accepted_values:
              arguments: { values: ["canceled", "created", "delivered", "invoiced", "processing", "shipped", "unavailable"] }
      - name: order_purchase_date
        data_tests: [not_null]

  - name: clean_transactions
    description: "Validated order lines. Sales stripped of currency symbols; percentage discounts converted to fractions."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: sales
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: { expression: ">= 0" }
      - name: quantity
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: { expression: "> 0" }
      - name: discount
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: { expression: "between 0 and 1" }

  - name: clean_returns
    description: "Validated returns from both JSON layouts."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: refund_amount
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: { expression: ">= 0" }
      - name: return_status
        data_tests:
          - accepted_values:
              arguments: { values: ["Approved", "Pending", "Rejected"] }
      - name: return_date
        data_tests: [not_null]

  - name: clean_products
    description: "Validated product catalogue; UPC repaired from scientific notation."
    columns:
      - name: product_id
        data_tests: [not_null]
      - name: product_name
        data_tests: [not_null]

  - name: clean_vendors
    description: "Validated vendor reference data."
    columns:
      - name: vendor_id
        data_tests: [not_null]
      - name: vendor_name
        data_tests: [not_null]

  - name: rejected_records
    description: "Quarantine: one row per rule failure across all entities, generated from macros/rules/silver_rules.sql."
    columns:
      - name: source_table
        description: "clean_<entity> the row was rejected from."
        data_tests: [not_null]
      - name: record_key
        description: "Business key of the rejected row (order_id for transactions, so not unique)."
      - name: affected_field
        data_tests: [not_null]
      - name: issue_type
        data_tests:
          - accepted_values:
              arguments: { values: ["missing_value", "invalid_value", "out_of_range", "parse_failure"] }
      - name: record_data
        description: "The harmonised row as JSON; NULLs written as the text 'NULL', as in Databricks."
      - name: _source_file
        data_tests: [not_null]

  - name: pipeline_audit_log
    description: "Row count reconciliation per entity: bronze_count = silver_count + rejected_count."
    columns:
      - name: entity
        data_tests: [unique, not_null]
      - name: reconciliation_diff
        description: "Must be 0: every Bronze row is either clean or rejected."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: { expression: "= 0" }
