version: 2

models:
  - name: clean_orders
    description: "Validated orders with ship mode expanded and the purchase date parsed."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: ship_mode
        data_tests:
          - accepted_values:
              arguments: { values: ["First Class", "Second Class", "Standard Class", "Same Day"] }
      - name: order_status
        data_tests:
          - accepted_values:
              arguments: { values: ["canceled", "created", "delivered", "invoiced", "processing", "shipped", "unavailable"] }
      - name: order_purchase_date
        data_tests: [not_null]
