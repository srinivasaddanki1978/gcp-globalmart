version: 2

models:
  - name: stg_orders
    description: >
      Expands ship-mode abbreviations, lower-cases status and parses the purchase date (3 layouts). Adds one _fail_<rule> flag per Silver rule, _has_any_failure and record_data,
      all generated from macros/rules/silver_rules.sql. Feeds clean_orders and rejected_records.
